<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=240, user-scalable=no">
<title>R1 probe</title>
<style>
 body{margin:0;background:#000;color:#0f0;font:10px monospace}
 #l{white-space:pre-wrap;padding:2px;height:268px;overflow:hidden}
 #f{padding:2px;color:#ff0}
</style></head>
<body><div id="l"></div><div id="f"></div>
<script>
// Logs every input-ish event so we learn the R1's real event names.
var L=document.getElementById('l'),lines=[];
function log(s){lines.push(s);if(lines.length>24)lines.shift();L.textContent=lines.join('\n');}
log('ua: '+navigator.userAgent.slice(0,60));
log('size: '+innerWidth+'x'+innerHeight+' dpr='+devicePixelRatio);
['sideClick','longPressStart','longPressEnd','scrollUp','scrollDown','ptt','pttStart','pttEnd'].forEach(function(n){
  window.addEventListener(n,function(){log('window.'+n);});
  document.addEventListener(n,function(){log('document.'+n);});
});
['keydown','wheel','touchstart','pointerdown','devicemotion'].forEach(function(n){
  var last=0;
  window.addEventListener(n,function(e){var t=Date.now();if(t-last<300)return;last=t;
    log(n+(e.key?' key='+e.key+' code='+e.code:'')+(e.deltaY?' dY='+e.deltaY:''));},{passive:true});
});
log('window.creationStorage: '+typeof window.creationStorage);
var A=window.AudioContext||window.webkitAudioContext,ac=null;
log('AudioContext: '+typeof A);
if(A){try{ac=new A();log('audio before tap: '+ac.state);}catch(e){log('audio ctor error: '+e);}}
var tapped=0;
document.body.addEventListener('click',function(){
  if(!A)return;
  tapped++;
  if(!ac)ac=new A();
  log('audio at tap #'+tapped+': '+ac.state);
  ac.resume().then(function(){
    log('audio after resume: '+ac.state+' rate='+ac.sampleRate);
    var o=ac.createOscillator(),g=ac.createGain();
    o.frequency.value=440;g.gain.value=0.2;o.connect(g);g.connect(ac.destination);
    o.start();o.stop(ac.currentTime+0.4);
    log('beep 440Hz 0.4s: did you hear it?');
  }).catch(function(e){log('resume error: '+e);});
});
addEventListener('resize',function(){log('resize: '+innerWidth+'x'+innerHeight);});
// rAF frame rate, refreshed every second
var F=document.getElementById('f'),fr=0,t0=performance.now();
(function tick(){fr++;var t=performance.now();
  if(t-t0>=1000){F.textContent='raf fps: '+Math.round(fr*1000/(t-t0))+'  '+innerWidth+'x'+innerHeight;fr=0;t0=t;}
  requestAnimationFrame(tick);})();
log('Tap to test audio (beep); then turn wheel, click side button, hold it.');
</script></body></html>
